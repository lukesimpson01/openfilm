<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shorts Editor</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%234568ee%27/%3E%3Ctext x=%2716%27 y=%2722.5%27 text-anchor=%27middle%27 font-family=%27Inter,sans-serif%27 font-weight=%27800%27 font-size=%2718%27 fill=%27white%27%3ES%3C/text%3E%3C/svg%3E">
<script>
  /* the theme before the first paint, so the wrong one never flashes: light unless the person chose another */
  (function () {
    var t = 'light';
    try { t = localStorage.getItem('openfilm.theme') || 'light'; } catch (e) {}
    if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light';
  })();
</script>
<script>/* Clyra: hand Cmd/Ctrl+J (Task View) and +K (app launcher) up to the window this editor is shown in. */
if(window.top&&window.top!==window)window.addEventListener('keydown',function(e){if(!(e.metaKey||e.ctrlKey)||e.altKey||e.shiftKey||e.repeat)return;var k=e.key.toLowerCase();if(k!=='j'&&k!=='k')return;e.preventDefault();e.stopPropagation();window.top.postMessage({type:'clyra:shortcut',shortcut:k==='j'?'taskview':'launcher'},'*')},true);</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
